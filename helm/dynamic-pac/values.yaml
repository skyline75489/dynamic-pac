replicaCount: 1

image:
  repository: dynamic-pac
  tag: latest
  pullPolicy: IfNotPresent

# Required: the SOCKS5 proxy string injected into the PAC file.
pacProxy: ""

# Optional: alternative proxy chain used by clients on the tailnet
# (e.g. "SOCKS5 100.101.1.2:1080; PROXY 100.101.1.2:8080; DIRECT;").
# Setting it also enables the Tailscale-specific rules.
pacProxyTsAlt: ""

# Optional: IPv4 ranges considered to be tailnet clients. Either a
# comma-separated list or a JSON list. Defaults to 100.64.0.0/10 when set.
# Setting it also enables the Tailscale-specific rules.
tsClientCidrs: ""

# Optional: enable the Tailscale passthrough rule (".ts.net" -> DIRECT)
# even when no other Tailscale variable is set. Enabled by default.
tsPassthroughEnabled: "1"

# Required: the remote URL to fetch the PAC rules from.
remotePacUrl: ""

# Optional: SOCKS5 proxy for outbound fetches (socks5://host:port).
fetchProxy: ""

# Seconds before the cached remote PAC is considered stale.
gfwlistCacheTtl: "86400"

# Optional: Redis URL for durable caching (redis://host:port).
redisUrl: ""

# Path to the bundled fallback PAC file inside the image.
fallbackPacPath: "fallback.pac"

# Path to the fallback China IP data file (JSON CIDR list).
# Generated on first successful APNIC fetch; used when APNIC is unreachable.
fallbackIpCnPath: "fallback_ip_cn.json"

# Redis TTL for cached China IP data (seconds, default 7 days).
# Flora PAC data is refreshed in background when this expires.
floraCacheTtl: "604800"

service:
  type: ClusterIP
  port: 8080

proxy:
  enabled: false
  port: 8888

# Routing mode for the CONNECT proxy: "gfwlist" (default) or "whitelist"
proxyMode: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /proxy.pac
    initialDelaySeconds: 5
    periodSeconds: 10
