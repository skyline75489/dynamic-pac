apiVersion: v1
kind: Service
metadata:
  name: {{ include "dynamic-pac.fullname" . }}
  labels:
    {{- include "dynamic-pac.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.proxy.enabled }}
    - port: {{ .Values.proxy.port }}
      targetPort: proxy
      protocol: TCP
      name: proxy
    {{- end }}
  selector:
    {{- include "dynamic-pac.selectorLabels" . | nindent 4 }}
