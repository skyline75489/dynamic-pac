apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dynamic-pac.fullname" . }}
  labels:
    {{- include "dynamic-pac.labels" . | nindent 4 }}
type: Opaque
stringData:
  PAC_PROXY: {{ .Values.pacProxy | quote }}
  REMOTE_PAC_URL: {{ .Values.remotePacUrl | quote }}
  {{- if .Values.fetchProxy }}
  FETCH_PROXY: {{ .Values.fetchProxy | quote }}
  {{- end }}
  GFWLIST_CACHE_TTL: {{ .Values.gfwlistCacheTtl | quote }}
  {{- if .Values.redisUrl }}
  REDIS_URL: {{ .Values.redisUrl | quote }}
  {{- end }}
  FALLBACK_PAC_PATH: {{ .Values.fallbackPacPath | quote }}
  FLORA_FALLBACK_PATH: {{ .Values.fallbackIpCnPath | quote }}
  FLORA_CACHE_TTL: {{ .Values.floraCacheTtl | quote }}
  {{- if .Values.proxy.enabled }}
  PROXY_PORT: {{ .Values.proxy.port | quote }}
  {{- end }}
