name: Lint & Test

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# The 'ubuntu-latest' label maps to an Ubuntu 26.04 job container, so
# actions/setup-python resolves linux-26.04 assets from actions/python-versions
# and installs the requested interpreter normally.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Byte-compile all modules
        run: python -m compileall -q . -x '(__pycache__|\.venv)'

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show interpreter
        run: python --version

      - name: Run unit tests
        env:
          REMOTE_PAC_URL: "http://unused.invalid/proxy.pac"
          PAC_PROXY: "SOCKS5 127.0.0.1:1080; DIRECT;"
        run: |
          python -m unittest discover -v -p 'test_*.py'
